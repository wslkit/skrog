name: e2e

# The acceptance suite: 45 ordered stages driving the real skrog.exe against a
# real engine on a real Windows machine (test/e2e). It covers very nearly every
# headline README claim -- hello-world, Compose, Testcontainers, Dev Containers,
# kind, act, GitLab, Dagger, GPU, remote mTLS, idle-stop and wake, migrate,
# uninstall, "nothing left behind".
#
# It existed for months and NO workflow ran it. `go test ./...` skips it (it is
# behind //go:build e2e) and `go vet ./...` never type-checked it, so it could
# not even fail to compile in CI. A release labelled stable while its acceptance
# suite is run by hand is asserting something nobody verified (#11).
#
# Why not a PR gate: it provisions a real WSL2 distro, downloads the published
# rootfs and runs containers -- minutes, not seconds, and it mutates the runner.
# Manual only for now — see the note on the trigger below. RELEASING.md
# requires a run on the release commit, which is the moment it has to be true.
#
# The platform excuse is retired and proven retired. PLAN.md said hosted
# `windows-latest` exposes nested virtualization; the sibling setup-skrog repo
# installs the engine and runs `docker run --rm hello-world` on that runner on
# every push. No self-hosted runner is needed on x64.

# The nightly schedule is DISABLED, deliberately and temporarily (#448).
#
# It ran for two nights and both were red on #429, a known and triaged bug in
# `restart --supervisor`. A nightly that is expected to be red is a nightly
# nobody reads, and the next real regression would have arrived as one more
# red run in a row of them — worse than no nightly, because it looks like
# coverage.
#
# #429 IS NOW FIXED and that stage passes:
#
#   run 35662530599
#   --- PASS: TestAcceptance/SupervisorRestartReplacesTheProcess (8.33s)
#
# The schedule stays off anyway, because the same run then failed on #468 --
# `skrog reset --to <snapshot>`, a stage that had NEVER executed in CI before,
# because #429 killed the suite two stages earlier every time. Fixing the
# first failure revealed the second, which is the suite doing its job.
#
# Turning the nightly on into a still-red suite would recreate exactly the
# situation #448 exists to escape, so the condition is unchanged in substance:
# re-enable when the suite can be green, now tracked by #468 rather than #429.
#
# Manual dispatch is unaffected, and RELEASING.md still requires a run on the
# release commit — which is the moment it actually has to be true.
on:
  workflow_dispatch:

permissions:
  contents: read

# wsl.exe writes its OWN messages as UTF-16LE -- distro lists, --version, the
# "no installed distributions" notice -- so anything that shells out to it and
# logs the result raw produces one NUL between every character:
#
#   W^@i^@n^@d^@o^@w^@s^@ ^@S^@u^@b^@s^@y^@s^@t^@e^@m^@ ^@f^@o^@r^@ ^@L^@i^@n^@u^@x^@
#
# That is what the leftovers step has been putting in the job log, and it is
# the one place a red run is supposed to be readable.
#
# WSL_UTF8=1 makes wsl.exe emit UTF-8 instead (WSL 0.64.0+). Set for the whole
# workflow rather than per step, because every step here may reach wsl.exe --
# including the suite itself, which calls `wsl.exe --list` directly.
#
# The product does not need this: internal/wsl/decode.go detects and converts
# UTF-16 already, honouring a BOM and falling through to UTF-8 untouched. This
# is for the callers that bypass it, which are all test and CI plumbing.
env:
  WSL_UTF8: '1'

jobs:
  acceptance:
    name: acceptance suite (windows-latest)
    runs-on: windows-latest
    # The suite's own default is 30m; this bounds the job around it including
    # the rootfs download, rather than letting a wedged stage burn six hours.
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version: stable

      # Type-check it even if the run later fails. This is the cheap half of
      # the problem: for months nothing compiled this file, so it could rot
      # against the packages it drives without anyone finding out.
      - name: the suite still compiles
        shell: pwsh
        working-directory: test/e2e
        run: |
          go vet -tags e2e ./...
          if ($LASTEXITCODE -ne 0) { throw "test/e2e does not build" }

      - name: environment
        shell: pwsh
        run: |
          wsl --version
          # A missing docker CLI makes the suite skip rather than fail, which
          # would look like a pass. Say what is here before it runs.
          $d = Get-Command docker -ErrorAction SilentlyContinue
          if ($d) { "docker: $($d.Source)" } else { "docker: NOT FOUND — the suite will skip" }

      # A wholesale skip is not a pass, and `go test` exits 0 for one.
      #
      # TestAcceptance skips entirely when it is not Windows or finds no docker
      # CLI. Both are environment faults, both would go green, and green is
      # exactly what a release checklist reads. So the output is captured and
      # the two wholesale-skip messages are treated as failures.
      #
      # Per-stage skips stay allowed: act, dagger, kind, devcontainer and a GPU
      # are genuinely optional on a hosted runner, and demanding them would
      # make the suite unrunnable rather than more honest.
      - name: acceptance
        shell: pwsh
        working-directory: test/e2e
        run: |
          go test -tags e2e -timeout 45m -v . 2>&1 | Tee-Object -FilePath e2e.log
          $code = $LASTEXITCODE
          $log = Get-Content e2e.log -Raw
          foreach ($m in @('acceptance runs on Windows with WSL2',
                           'no docker CLI found on PATH')) {
            if ($log -match [regex]::Escape($m)) {
              throw "the suite skipped wholesale ($m) — that is an environment failure, not a pass"
            }
          }
          if ($log -notmatch 'PASS|FAIL') { throw "no test result in the output; the suite did not run" }
          # Report which optional stages were skipped, so a green run says what
          # it did NOT cover rather than implying it covered everything.
          $skips = Select-String -Path e2e.log -Pattern '^\s*--- SKIP' -AllMatches
          if ($skips) { "`nstages skipped on this runner:"; $skips | ForEach-Object { "  " + $_.Line.Trim() } }
          exit $code

      - name: suite log
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: e2e-log
          path: test/e2e/e2e.log
          if-no-files-found: warn

      - name: leftovers
        if: always()
        shell: pwsh
        run: |
          # The suite cleans up after itself; a failure can leave a distro
          # behind. Print what is registered so a red run says whether the
          # runner was left dirty.
          wsl --list --verbose
          exit 0
