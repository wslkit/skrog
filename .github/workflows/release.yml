name: release

# Builds and attaches the skrog binaries when an app release is published.
#
# Rootfs releases are a separate namespace (tag prefix rootfs-) handled by
# rootfs.yml; this workflow skips them so the two never cross-contaminate.
#
# Artifacts are signed with cosign keyless (Sigstore, GitHub OIDC) and carry
# SLSA build provenance (#147), so a download can be tied to this workflow, this
# repository and this commit — with no long-lived key to manage or leak.
#
# Authenticode signing for Windows SmartScreen is a different thing entirely: it
# needs a purchased certificate and is tracked separately (#77). Until that
# lands, SmartScreen still warns about an unsigned executable, and saying
# otherwise here would be worse than the honest gap.

on:
  release:
    types: [published]

  # Changes to the release path build immediately, so a mistake here is caught
  # now rather than discovered while cutting a release. This also makes GitHub
  # ingest the file at all: a workflow triggered only by release/dispatch is
  # never parsed until one of those fires, so it stays invisible to
  # `workflow_dispatch` — which is exactly what happened on the first attempt.
  push:
    branches: [main]
    paths: ['.github/workflows/release.yml']
  pull_request:
    paths: ['.github/workflows/release.yml']

  # Lets the whole build be exercised without publishing anything.
  workflow_dispatch:
    inputs:
      version:
        description: 'version string to stamp (dry run only, nothing is uploaded)'
        required: false
        default: '0.0.0-dryrun'

permissions:
  contents: read

jobs:
  build:
    name: build binaries
    if: github.event_name != 'release' || !startsWith(github.event.release.tag_name, 'rootfs-')
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version: stable

      - name: resolve version
        id: v
        shell: pwsh
        # Values from github.event / inputs reach the shell via env, never
        # spliced into the script (#87): a tag like v1$(...) or a quote would
        # otherwise execute here — and this feeds a job that publishes.
        env:
          TAG: ${{ github.event.release.tag_name }}
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          if ($env:GITHUB_EVENT_NAME -eq 'release') {
            # Strip a leading v so `skrog version` reports 0.1.0, not v0.1.0.
            $version = $env:TAG -replace '^v', ''
          } elseif ($env:INPUT_VERSION) {
            $version = $env:INPUT_VERSION
          } else {
            # push / pull_request: a validation build, not a release.
            $version = '0.0.0-ci'
          }
          "version=$version" >> $env:GITHUB_OUTPUT
          Write-Host "building version $version"

      - name: build
        shell: pwsh
        env:
          CGO_ENABLED: '0'
          VERSION: ${{ steps.v.outputs.version }}
        run: |
          New-Item -ItemType Directory -Force dist | Out-Null
          # -trimpath keeps absolute build paths out of the binary, so the same
          # source produces the same bytes on a different machine.
          foreach ($arch in @('amd64', 'arm64')) {
            $env:GOOS = 'windows'
            $env:GOARCH = $arch
            $out = "dist/skrog_${env:VERSION}_windows_$arch/skrog.exe"
            New-Item -ItemType Directory -Force (Split-Path $out) | Out-Null
            go build -trimpath -ldflags "-s -w -X main.buildVersion=$env:VERSION" -o $out ./cmd/skrog
            if ($LASTEXITCODE -ne 0) { exit 1 }
            # skrogw is the windowless logon launcher (GUI subsystem, so no
            # console flashes at startup); autostart refuses without it.
            $outw = "dist/skrog_${env:VERSION}_windows_$arch/skrogw.exe"
            go build -trimpath -ldflags "-s -w -H=windowsgui" -o $outw ./cmd/skrogw
            if ($LASTEXITCODE -ne 0) { exit 1 }
            # skrogtray is the optional status-light tray (GUI subsystem); it
            # shells out to skrog.exe for everything.
            $outt = "dist/skrog_${env:VERSION}_windows_$arch/skrogtray.exe"
            go build -trimpath -ldflags "-s -w -H=windowsgui" -o $outt ./cmd/skrogtray
            if ($LASTEXITCODE -ne 0) { exit 1 }
            Copy-Item LICENSE, README.md (Split-Path $out)
            # Shell completions (#392), generated from this same tree and
            # verified current by CI. Text files, so the size budget below is
            # unaffected.
            Copy-Item -Recurse completions (Split-Path $out)
            Write-Host "built $out ($([math]::Round((Get-Item $out).Length/1MB,1)) MB) + skrogw + skrogtray"
          }

      - name: verify the version stamp and size budget
        shell: pwsh
        env:
          VERSION: ${{ steps.v.outputs.version }}
        run: |
          # The amd64 binary runs on this runner, so the release can assert that
          # the stamp actually took - a release reporting "dev" is a silent
          # embarrassment that is easy to ship and awkward to withdraw.
          #
          # `skrog version` exits 3 when no engine is installed, which is
          # exactly the state of a CI runner. GitHub's pwsh shell propagates
          # $LASTEXITCODE, so that expected 3 would fail this step; the exit
          # code is therefore checked deliberately rather than inherited.
          $exe = "dist/skrog_${env:VERSION}_windows_amd64/skrog.exe"
          $json = & $exe version --json
          $code = $LASTEXITCODE
          if ($code -ne 0 -and $code -ne 3) {
            Write-Host "::error::skrog version exited $code"
            exit 1
          }
          $reported = ($json | ConvertFrom-Json).app
          if ($reported -ne $env:VERSION) {
            Write-Host "::error::binary reports version '$reported', expected '$env:VERSION'"
            exit 1
          }
          Write-Host "version stamp OK: $reported (exit $code, 3 = no engine installed)"

          # PLAN section 10 budgets under 15 MB for the Windows-side footprint.
          # Warn rather than fail: the budget covers the installed footprint, and
          # a release should not be blocked by a metric this workflow only
          # partially measures.
          foreach ($f in Get-ChildItem dist -Recurse -Filter skrog.exe) {
            $mb = [math]::Round($f.Length/1MB, 2)
            Write-Host "$($f.FullName): $mb MB"
            if ($mb -gt 15) { Write-Host "::warning::$($f.Name) is $mb MB, over the 15 MB budget" }
          }
          # Explicit, so no stray native exit code from above leaks out.
          exit 0

      - name: package
        shell: pwsh
        run: |
          Push-Location dist
          foreach ($dir in Get-ChildItem -Directory) {
            Compress-Archive -Path "$($dir.Name)/*" -DestinationPath "$($dir.Name).zip" -Force
            Remove-Item -Recurse -Force $dir.Name
          }
          # One checksum file covering every artifact, in the usual format.
          #
          # Written with explicit LF endings, not Set-Content, which emits CRLF
          # on PowerShell (#248). The trailing \r becomes part of the filename
          # `sha256sum -c` looks for, so the verification command this project
          # documents fails on every line with "no file was verified" — while
          # the hashes themselves are perfectly correct. Windows is the entire
          # audience here and they run sha256sum from Git Bash or WSL, so this
          # is the first step of the first check a careful user performs.
          $lines = Get-ChildItem -Filter *.zip | ForEach-Object {
            $h = (Get-FileHash $_.Name -Algorithm SHA256).Hash.ToLower()
            "$h  $($_.Name)"
          }
          [IO.File]::WriteAllText(
            (Join-Path $PWD 'SHA256SUMS'),
            (($lines -join "`n") + "`n"),
            (New-Object Text.UTF8Encoding $false))

          # Assert it, rather than trusting that the line above stayed correct:
          # the cosign bundle signs these exact bytes, so a reformat is not
          # something a later release can quietly repair.
          $raw = [IO.File]::ReadAllBytes((Join-Path $PWD 'SHA256SUMS'))
          if ($raw -contains 13) { throw "SHA256SUMS contains CR; sha256sum -c would fail" }
          Get-Content SHA256SUMS
          Pop-Location

      - uses: actions/upload-artifact@v7
        with:
          name: skrog-binaries
          path: dist/
          retention-days: 14

  # The dry run's other half.
  #
  # `publish` is gated on event_name == 'release', so a workflow_dispatch run
  # exercised the build and nothing else -- and the release-only half is where
  # the interesting actions live. When Dependabot bumped download-artifact 4->8
  # and attest-build-provenance 2->4, both PRs went green having never executed
  # either action, and a dispatch dry run did not reach them either. A failure
  # there surfaces AFTER the release is published, because this workflow runs on
  # release:published -- leaving a published release with no assets on it.
  #
  # So: same steps, same actions, on dispatch. It stops before uploading, and it
  # deliberately does NOT take contents: write, so it cannot publish anything
  # even by accident. It does write a real attestation and a real Rekor entry
  # for the dry-run binaries, which is the point -- an attestation that was
  # never produced is not evidence the path works.
  verify-signing:
    name: dry run - provenance and signing
    needs: build
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      attestations: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: skrog-binaries
          path: dist

      # v8 stopped unzipping unconditionally; if that ever changes what lands
      # here, fail loudly in a dry run rather than quietly attest a zip.
      - name: the artifact really did unpack
        run: |
          set -euo pipefail
          ls -l dist
          test -f dist/SHA256SUMS || { echo "::error::SHA256SUMS missing -- download-artifact did not unpack as expected"; exit 1; }
          count=$(find dist -name '*.zip' | wc -l)
          test "$count" -ge 1 || { echo "::error::no zips in dist/"; exit 1; }
          echo "unpacked $count zip(s) and SHA256SUMS"

      - uses: actions/attest-build-provenance@v4
        with:
          subject-path: 'dist/*'

      - uses: sigstore/cosign-installer@v3
      - name: sign and verify the checksum file
        run: |
          cosign sign-blob --yes \
            --bundle dist/SHA256SUMS.cosign.bundle \
            dist/SHA256SUMS
          cosign verify-blob \
            --bundle dist/SHA256SUMS.cosign.bundle \
            --certificate-identity-regexp "^https://github.com/${GITHUB_REPOSITORY}/" \
            --certificate-oidc-issuer https://token.actions.githubusercontent.com \
            dist/SHA256SUMS

  # Separated so only this job holds contents: write. The build job compiles
  # code and must not be able to publish.
  publish:
    name: attach to release
    needs: build
    if: github.event_name == 'release' && !startsWith(github.event.release.tag_name, 'rootfs-')
    runs-on: ubuntu-latest
    permissions:
      contents: write
      # id-token for the OIDC token cosign and the attestation exchange for a
      # short-lived certificate; attestations to record the provenance.
      id-token: write
      attestations: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: skrog-binaries
          path: dist

      # SLSA build provenance for every artifact: what built it, from which
      # repository, at which commit, in which workflow run. Verified later with
      # `gh attestation verify <file> --owner <org>` and no key material.
      - uses: actions/attest-build-provenance@v4
        with:
          subject-path: 'dist/*'

      # A cosign signature as well, because the two answer different questions:
      # provenance says "GitHub built this here", the signature is a detached
      # artifact anyone can check offline against the Sigstore transparency log
      # without the GitHub API. SHA256SUMS covers every zip by hash, so signing
      # it signs the set.
      - uses: sigstore/cosign-installer@v3
      - name: sign the checksum file
        run: |
          cosign sign-blob --yes \
            --bundle dist/SHA256SUMS.cosign.bundle \
            dist/SHA256SUMS
          cosign verify-blob \
            --bundle dist/SHA256SUMS.cosign.bundle \
            --certificate-identity-regexp "^https://github.com/${GITHUB_REPOSITORY}/" \
            --certificate-oidc-issuer https://token.actions.githubusercontent.com \
            dist/SHA256SUMS

      # --repo is required: this job downloads artifacts without checking out
      # the code, so gh has no git remote to infer the repository from and
      # fails with "not a git repository".
      - name: upload release assets
        # TAG via env, not spliced into the command (#87): this job holds
        # contents: write, so a crafted tag name must never reach the shell.
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.release.tag_name }}
          REPO: ${{ github.repository }}
        run: gh release upload "$TAG" dist/* --clobber --repo "$REPO"
