name: rootfs

on:
  push:
    branches: [main]
    paths: ['guest/rootfs/**', '.github/workflows/rootfs.yml']
  pull_request:
    paths: ['guest/rootfs/**', '.github/workflows/rootfs.yml']
  # A rootfs release (tag: rootfs-vX.Y.Z) rebuilds and attaches its assets.
  # App releases are handled by release.yml and skip the publish job below.
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lint:
    name: shellcheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # Same invocation as scripts/lint.ps1 and the pre-commit hook: -x follows
      # `source=` directives, -P SCRIPTDIR resolves them next to each script
      # (versions.env sits beside build.sh, not in the working directory).
      - name: shellcheck
        run: shellcheck -x -P SCRIPTDIR guest/rootfs/*.sh spike/a/*.sh

  build:
    # One rootfs per architecture, each compiled NATIVELY (#388).
    #
    # No QEMU, deliberately. Every binary here is built from upstream source,
    # and building an arm64 engine under emulation would turn a ~4 minute job
    # into a very long one for bytes that are harder to trust -- an emulated
    # toolchain is a difference between what CI exercises and what users run.
    # GitHub's ubuntu-24.04-arm runners are real arm64 and free for public
    # repositories, so there is no reason to emulate.
    name: build rootfs (${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90
    strategy:
      # One architecture failing must not cancel the other: when arm64 breaks,
      # the amd64 result is exactly what says whether the cause is the change
      # or the architecture.
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v7

      # Compiling the engine is ~4 min of the job; assembling the rootfs is
      # seconds. Cache only the binaries, keyed on what actually determines
      # them, so editing daemon.json or wsl.conf still rebuilds the tarball
      # from cached binaries. No restore-keys: a partial match would hand us
      # binaries built from different pins, which is worse than a cache miss.
      #
      # The architecture is in the key because the binaries are architecture
      # specific and runner.os says "Linux" for both. Without it the two jobs
      # would share one entry and whichever ran second would ship the other's
      # ELFs -- which the smoke test's own version check would NOT catch,
      # since `dockerd --version` runs fine under binfmt and reports the
      # pinned version either way.
      - name: engine binary cache
        id: engine-cache
        uses: actions/cache@v6
        with:
          path: engine-bin
          key: engine-bin-${{ runner.os }}-${{ matrix.arch }}-${{ hashFiles('guest/rootfs/versions.env', 'guest/rootfs/build-engine.sh') }}

      - name: build
        env:
          BIN_DIR: ${{ github.workspace }}/engine-bin
        run: ./guest/rootfs/build.sh "$GITHUB_WORKSPACE/out"

      - name: report cache outcome
        run: |
          echo "engine cache hit: ${{ steps.engine-cache.outputs.cache-hit || 'false' }}" >> "$GITHUB_STEP_SUMMARY"

      - name: smoke test the rootfs
        run: ./guest/rootfs/smoke-test.sh "$GITHUB_WORKSPACE/out"

      # The smoke test checks the artifact's shape. These two check that it
      # works and that it is complete — the gap that let a rootfs whose engine
      # could not start reach a published release, twice.
      - name: boot the engine
        run: ./guest/rootfs/boot-test.sh "$GITHUB_WORKSPACE/out"

      - name: compare against Docker's static bundle
        run: ./guest/rootfs/reference-diff.sh "$GITHUB_WORKSPACE/out"

      - uses: actions/upload-artifact@v7
        with:
          name: skrog-rootfs-${{ matrix.arch }}
          path: out/
          retention-days: 14

  publish:
    name: attach to release
    needs: build
    # Only rootfs releases, which carry a rootfs- tag prefix. Without this
    # check every app release (v0.1.0, previews) would also get rootfs
    # tarballs attached to it, because the release event does not distinguish
    # what is being released.
    if: github.event_name == 'release' && startsWith(github.event.release.tag_name, 'rootfs-')
    runs-on: ubuntu-latest
    permissions:
      contents: write
      # See release.yml: id-token for the OIDC exchange cosign and the
      # attestation both need, attestations to record the provenance (#147).
      id-token: write
      attestations: write
    steps:
      # Both architectures into one directory. The filenames carry the
      # architecture, so they cannot collide, and one `gh release upload`
      # attaches the whole set -- which is what makes a rootfs release atomic
      # rather than "amd64 is up, arm64 is coming".
      - uses: actions/download-artifact@v8
        with:
          pattern: skrog-rootfs-*
          merge-multiple: true
          path: out

      # Provenance over the tarball, its checksum and the SBOM, so a rootfs can
      # be tied to this workflow and commit independently of the sha256 pin in
      # internal/release/manifest.json. Tampering that also edits the manifest
      # still fails this check.
      - uses: actions/attest-build-provenance@v4
        with:
          subject-path: 'out/*'

      - uses: sigstore/cosign-installer@v3
      # One signature per checksum file, because there is one per architecture
      # now. `sums=$(ls out/*.tar.gz.sha256)` was a single unquoted assignment
      # that silently became "file1 file2" the moment a second architecture
      # appeared -- cosign would have signed a path that does not exist.
      - name: sign the rootfs checksums
        run: |
          shopt -s nullglob
          sumfiles=(out/*.tar.gz.sha256)
          if [ ${#sumfiles[@]} -eq 0 ]; then
            echo "no .sha256 files to sign; the build produced nothing" >&2
            exit 1
          fi
          for sums in "${sumfiles[@]}"; do
            echo "==> signing $sums"
            cosign sign-blob --yes --bundle "$sums.cosign.bundle" "$sums"
            cosign verify-blob \
              --bundle "$sums.cosign.bundle" \
              --certificate-identity-regexp "^https://github.com/${GITHUB_REPOSITORY}/" \
              --certificate-oidc-issuer https://token.actions.githubusercontent.com \
              "$sums"
          done
      # --repo is required: this job downloads artifacts without checking out
      # the code, so gh has no git remote to infer the repository from and
      # fails with "not a git repository".
      - name: upload release assets
        # TAG/REPO via env, not spliced into the command (#87): this job holds
        # contents: write.
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.release.tag_name }}
          REPO: ${{ github.repository }}
        run: gh release upload "$TAG" out/* --clobber --repo "$REPO"
